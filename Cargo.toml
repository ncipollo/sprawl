[package]
name = "sprawl"
description = "What was I doing? Where did it go?"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/sprawl"
version = "0.1.0"

[dependencies]
axum = "0.8.9"
boa_engine = "0.21.1"
boa_gc = "0.21.1"
clap = { version = "4.6.6", features = ["derive"] }
gpui = "0.2.2"
gpui-charts = "0.1.0"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros"] }

[package.metadata.bundle]
name = "Sprawl"
identifier = "com.ncipollo.sprawl"
short_description = "What was I doing? Where did it go?"
category = "public.app-category.productivity"
osx_minimum_system_version = "10.15"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
